<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Robot Wiring Architecture & Diagram</title>
  <style>
    :root {
      --bg: #090d13;
      --panel-bg: rgba(18, 23, 31, 0.95);
      --panel-border: #283344;
      --text-main: #f0f6fc;
      --text-muted: #8b9bb4;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Header Bar */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.5px;
    }

    header .badge {
      font-size: 11px;
      background: #1f6feb33;
      border: 1px solid #388bfd66;
      color: #58a6ff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: normal;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn {
      background: #1b2330;
      border: 1px solid #303d52;
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: #273447;
      border-color: #58a6ff;
    }

    /* Diagram Canvas Container */
    #viewport {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      overflow: hidden;
    }

    #viewport.panning {
      cursor: grabbing;
    }

    svg#canvas {
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
    }

    /* SVG Modules / Blocks */
    .module-box {
      rx: 6;
      stroke-width: 1.8;
      transition: filter 0.2s, stroke-width 0.2s;
      cursor: pointer;
    }

    .module-box:hover {
      filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.6));
      stroke-width: 2.2;
    }

    .module-title {
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      pointer-events: none;
    }

    .pmm-inner-label {
      font-size: 11px;
      font-weight: 600;
      fill: #c9d8ec;
      pointer-events: none;
    }

    /* Wire Hover & Selection */
    .wire-group {
      cursor: pointer;
    }

    .wire-hitbox {
      stroke: transparent;
      stroke-width: 14px;
      fill: none;
      cursor: pointer;
    }

    .wire-hitbox:hover + .wire-render-g {
      filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px var(--accent));
    }

    .wire-group.active .wire-render-g {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 12px var(--accent));
    }

    /* Interactive Legend / Key */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      backdrop-filter: blur(12px);
      z-index: 40;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      box-shadow: 0 10px 28px rgba(0,0,0,0.6);
      width: 280px;
    }

    #legend h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11.5px;
      transition: background 0.15s;
    }

    .legend-item:hover {
      background: #1e2838;
    }

    .legend-item.active {
      background: #1f6feb33;
      border-left: 3px solid var(--accent);
    }

    .swatch {
      width: 32px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Detail Modal */
    #detail-panel {
      position: absolute;
      top: 68px;
      right: 20px;
      width: 360px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 18px 20px;
      backdrop-filter: blur(14px);
      z-index: 60;
      box-shadow: 0 14px 35px rgba(0,0,0,0.65);
      display: none;
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #detail-panel h3 {
      font-size: 15px;
      margin-bottom: 3px;
      color: #fff;
    }

    #detail-panel .sub-heading {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .detail-row {
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-row span.label {
      color: var(--text-muted);
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .detail-row span.value {
      color: var(--text-main);
      font-weight: 500;
    }

    #close-detail {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    #close-detail:hover {
      color: #fff;
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      background: #222d3e;
      font-size: 11px;
      margin-right: 5px;
      margin-top: 4px;
      border: 1px solid #2d3b52;
    }

    .bg-dots {
      fill: #192231;
    }
  </style>
</head>

  <header>
    <h1>
      <span>⚡ Hero Robot Wiring Diagram</span>
      <span class="badge">RoboMaster 2026 Spec</span>
    </h1>
    <div class="header-controls">

  <!-- Detail Popup Panel -->

    <button id="close-detail">&times;</button>

  </div>

  <div id="viewport">

        </pattern>
      </defs>

      <!-- Pan & Zoom Group -->

        <!-- Infinite Grid Background Layer -->
        <rect x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid-dots)" />

        <!-- Boundaries Layer (Empty of line labels) -->
        <g id="boundaries-layer"></g>

        <!-- Wires / Cables Layer -->
        <g id="wires-layer"></g>

        <!-- Modules / Electronic Boards Layer -->
        <g id="modules-layer"></g>
      </g>
    </svg>
  </div>

    // Render Legend
    function initLegend() {
      Object.values(WIRE_SPECS).forEach(spec => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.setAttribute("data-wire-id", spec.id);

        let swatchHtml = "";
        if (spec.renderStyle === "twisted-pair") {
          swatchHtml = `<svg class="swatch" viewBox="0 0 32 12">
            <path d="M 0 3 Q 8 0 16 3 T 32 3" fill="none" stroke="${spec.c1}" stroke-width="2.2" />
            <path d="M 0 7 Q 8 10 16 7 T 32 7" fill="none" stroke="${spec.c2}" stroke-width="2.2" />
          </svg>`;
        } else if (spec.renderStyle === "dual-twisted") {
          swatchHtml = `<svg class="swatch" viewBox="0 0 32 12">
            <path d="M 0 2 Q 8 0 16 2 T 32 2" fill="none" stroke="${spec.c1}" stroke-width="1.8" />
            <path d="M 0 5 Q 8 8 16 5 T 32 5" fill="none" stroke="${spec.c2}" stroke-width="1.8" />
            <path d="M 0 8 Q 8 5 16 8 T 32 8" fill="none" stroke="${spec.c3}" stroke-width="1.8" />
          </svg>`;
        } else {
          swatchHtml = `<svg class="swatch" viewBox="0 0 32 12">
            <line x1="0" y1="6" x2="32" y2="6" stroke="${spec.stroke}" stroke-width="${spec.width || 2.5}" stroke-linecap="round" />
          </svg>`;
        }

        item.innerHTML = `${swatchHtml}<span>${spec.name}</span>`;
        item.addEventListener("click", () => {
          showDetailModal(spec);
          highlightWires(spec.id);
        });
        legendList.appendChild(item);
      });
    }

    // Convert Points Array to SVG Path String (Strict Horizontal & Vertical)
    function buildPathD(pts) {
      if (pts.length === 0) return "";
      return "M " + pts.map(p => `${p[0]} ${p[1]}`).join(" L ");
    }

    // Render Wires with Clean Offset Twin Wires for Twisted Pairs (Matching the Key)
    function renderWires() {
      const layer = document.getElementById("wires-layer");

      CONNECTIONS.forEach((conn) => {
        const spec = WIRE_SPECS[conn.spec];
        if (!spec || !conn.pts || conn.pts.length < 2) return;

        const pathD = buildPathD(conn.pts);
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.classList.add("wire-group");
        g.setAttribute("data-wire-id", spec.id);

        let renderContent = "";

        if (spec.renderStyle === "twisted-pair") {
          // Clean offset parallel lines with alternating colored wave pattern like in Key
          renderContent = `
            <g class="wire-render-g">
              <path class="wire-render" d="${pathD}" stroke="${spec.c1}" stroke-width="${spec.width}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path class="wire-render" d="${pathD}" stroke="${spec.c2}" stroke-width="${spec.width}" stroke-dasharray="8 8" stroke-dashoffset="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </g>
          `;
        } else if (spec.renderStyle === "dual-twisted") {
          renderContent = `
            <g class="wire-render-g">
              <path class="wire-render" d="${pathD}" stroke="${spec.c1}" stroke-width="${spec.width + 1}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path class="wire-render" d="${pathD}" stroke="${spec.c2}" stroke-width="${spec.width}" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              <path class="wire-render" d="${pathD}" stroke="${spec.c3}" stroke-width="${spec.width - 0.5}" stroke-dasharray="12 12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </g>
          `;
        } else {
          renderContent = `
            <g class="wire-render-g">
              <path class="wire-render" d="${pathD}" stroke="${spec.stroke}" stroke-width="${spec.width}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </g>
          `;
        }

        // Invisible wider stroke for easy click hitbox
        renderContent += `<path class="wire-hitbox" d="${pathD}" />`;

        g.innerHTML = renderContent;

        g.addEventListener("click", (e) => {
          e.stopPropagation();
          showDetailModal(spec, conn);
          highlightWires(spec.id);
        });

        layer.appendChild(g);
      });
    }

    // Render Modules
    function renderModules() {
      const layer = document.getElementById("modules-layer");
      MODULES.forEach(mod => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

        if (mod.isPMM) {
          // Custom PMM Module with all user-specified text annotations inside
          g.innerHTML = `
            <rect class="module-box" x="${mod.x}" y="${mod.y}" width="${mod.w}" height="${mod.h}" fill="${mod.bg}" stroke="${mod.stroke}" />
            <text class="module-title" x="${mod.x + mod.w / 2}" y="${mod.y + 105}" text-anchor="middle" font-size="16">PMM</text>
            <text class="pmm-inner-label" x="${mod.x + 30}" y="${mod.y + 24}">AB</text>
            <text class="pmm-inner-label" x="${mod.x + 85}" y="${mod.y + 24}">Gimbal</text>
            <text class="pmm-inner-label" x="${mod.x + 155}" y="${mod.y + 24}">Chassis</text>
            <text class="pmm-inner-label" x="${mod.x + 30}" y="${mod.y + 55}">MiniPC</text>
            <text class="pmm-inner-label" x="${mod.x + 115}" y="${mod.y + 70}">XT30</text>
            <text class="pmm-inner-label" x="${mod.x + 190}" y="${mod.y + 55}">Armor</text>
            <text class="pmm-inner-label" x="${mod.x + 190}" y="${mod.y + 80}">Armor</text>
            <text class="pmm-inner-label" x="${mod.x + 30}" y="${mod.y + 140}">UART</text>
            <text class="pmm-inner-label" x="${mod.x + 205}" y="${mod.y + 115}">Ref</text>
            <text class="pmm-inner-label" x="${mod.x + 205}" y="${mod.y + 145}">Ref</text>
            <text class="pmm-inner-label" x="${mod.x + 110}" y="${mod.y + 165}">XT60 in</text>
            <text class="pmm-inner-label" x="${mod.x + 185}" y="${mod.y + 165}">MCM Ref</text>
          `;
        } else if (mod.id === "upper-slipring-breakout") {
          g.innerHTML = `
            <rect class="module-box" x="${mod.x}" y="${mod.y}" width="${mod.w}" height="${mod.h}" fill="${mod.bg}" stroke="${mod.stroke}" />
            <text class="module-title" x="${mod.x + mod.w / 2}" y="${mod.y + 40}" text-anchor="middle">Upper Slipring Breakout</text>
            <text class="pmm-inner-label" x="${mod.x + 20}" y="${mod.y + 22}">CAN1</text>
            <text class="pmm-inner-label" x="${mod.x + 75}" y="${mod.y + 22}">AB</text>
            <text class="pmm-inner-label" x="${mod.x + 120}" y="${mod.y + 22}">MiniPC</text>
            <text class="pmm-inner-label" x="${mod.x + 180}" y="${mod.y + 22}">Jetson</text>
            <text class="pmm-inner-label" x="${mod.x + 235}" y="${mod.y + 22}">Gimbal</text>
            <text class="pmm-inner-label" x="${mod.x + 245}" y="${mod.y + 36}">UART</text>
            <text class="pmm-inner-label" x="${mod.x + 250}" y="${mod.y + 85}">Ref</text>
          `;
        } else if (mod.id === "lower-slipring-breakout") {
          g.innerHTML = `
            <rect class="module-box" x="${mod.x}" y="${mod.y}" width="${mod.w}" height="${mod.h}" fill="${mod.bg}" stroke="${mod.stroke}" />
            <text class="module-title" x="${mod.x + mod.w / 2}" y="${mod.y + 60}" text-anchor="middle">Lower Slipring Breakout</text>
            <text class="pmm-inner-label" x="${mod.x + 20}" y="${mod.y + 30}">CAN1</text>
            <text class="pmm-inner-label" x="${mod.x + 20}" y="${mod.y + 55}">UART</text>
            <text class="pmm-inner-label" x="${mod.x + 20}" y="${mod.y + 80}">MiniPC</text>
            <text class="pmm-inner-label" x="${mod.x + 85}" y="${mod.y + 90}">AB</text>
            <text class="pmm-inner-label" x="${mod.x + 145}" y="${mod.y + 90}">Gimbal</text>
            <text class="pmm-inner-label" x="${mod.x + 250}" y="${mod.y + 85}">Ref</text>
          `;
        } else {
          // Clean standard component with just its clean name (no sub labels)
          g.innerHTML = `
            <rect class="module-box" x="${mod.x}" y="${mod.y}" width="${mod.w}" height="${mod.h}" fill="${mod.bg}" stroke="${mod.stroke}" />
            <text class="module-title" x="${mod.x + mod.w / 2}" y="${mod.y + mod.h / 2 + 4}" text-anchor="middle">${mod.name}</text>
          `;
        }

        g.addEventListener("click", (e) => {
          e.stopPropagation();
          showModuleModal(mod);
        });

        layer.appendChild(g);
      });
    }

    // Highlighting
    function highlightWires(wireId) {
      document.querySelectorAll(".wire-group").forEach(el => {
        if (el.getAttribute("data-wire-id") === wireId) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      });

      document.querySelectorAll(".legend-item").forEach(el => {
        if (el.getAttribute("data-wire-id") === wireId) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      });
    }

    // Show Detail Modal
    function showDetailModal(spec, conn) {
      document.getElementById("panel-title").innerText = spec.name;
      document.getElementById("panel-sub").innerText = spec.type;

      let bodyHtml = `
        <div class="detail-row">
          <span class="label">Color Coding & Appearance</span>
          <span class="value">${spec.colorDesc}</span>
        </div>
        <div class="detail-row">
          <span class="label">Wire Gauge & Spec</span>
          <span class="value">${spec.gauge}</span>
        </div>
        <div class="detail-row">
          <span class="label">Connector Family</span>
          <span class="value">${spec.connector}</span>
        </div>
        <div class="detail-row">
          <span class="label">Crimp & Terminal Info</span>
          <span class="value">${spec.crimp}</span>
        </div>
        <div class="detail-row">
          <span class="label">Protocol & Electrical Ratings</span>
          <span class="value">${spec.protocol}</span>
        </div>
      `;

      if (conn) {
        bodyHtml += `
          <div style="border-top: 1px solid var(--panel-border); margin: 12px 0; padding-top: 8px;">
            <div class="detail-row">
              <span class="label">Selected Connection</span>
              <span class="value"><strong>${conn.from}</strong> ➔ <strong>${conn.to}</strong></span>
            </div>
          </div>
        `;
      }

      document.getElementById("panel-body").innerHTML = bodyHtml;
      detailPanel.style.display = "block";
    }

    // Show Module Info Modal
    function showModuleModal(mod) {
      document.getElementById("panel-title").innerText = mod.name;
      document.getElementById("panel-sub").innerText = `Component: ${mod.id}`;

      const connectedWires = CONNECTIONS.filter(c => c.from === mod.id || c.to === mod.id);

      let linksHtml = connectedWires.map(c => {
        const spec = WIRE_SPECS[c.spec];
        const isFrom = c.from === mod.id;
        const target = isFrom ? c.to : c.from;
        const dir = isFrom ? "➔ Out to" : "⬅ In from";
        return `<div class="tag" style="display:block; margin-bottom:5px;">${dir} <strong>${target}</strong>: ${spec.name}</div>`;
      }).join("");

      document.getElementById("panel-body").innerHTML = `
        <div class="detail-row">
          <span class="label">Connected Harnesses (${connectedWires.length})</span>
          <div style="margin-top: 8px;">${linksHtml || "No direct links recorded"}</div>
        </div>
      `;
      detailPanel.style.display = "block";
    }

    // Modal close
    document.getElementById("close-detail").addEventListener("click", () => {
      detailPanel.style.display = "none";
      highlightWires(null);
    });

    // Pan and Zoom Event Handlers
    viewport.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        isPanning = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        viewport.classList.add("panning");
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => {
      isPanning = false;
      viewport.classList.remove("panning");
    });

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = 1.12;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const prevScale = scale;
      if (e.deltaY < 0) {
        scale = Math.min(scale * zoomFactor, 4.0);
      } else {
        scale = Math.max(scale / zoomFactor, 0.2);
      }

      translateX = mouseX - (mouseX - translateX) * (scale / prevScale);
      translateY = mouseY - (mouseY - translateY) * (scale / prevScale);
      updateTransform();
    }, { passive: false });

    document.getElementById("btn-reset").addEventListener("click", () => {
      scale = 0.82;
      translateX = 40;
      translateY = 15;
      updateTransform();
    });

    document.getElementById("btn-fit").addEventListener("click", () => {
      scale = 0.65;
      translateX = 30;
      translateY = 10;
      updateTransform();
    });

    viewport.addEventListener("click", (e) => {
      if (e.target.id === "viewport" || e.target.id === "canvas" || (e.target.tagName === "rect" && e.target.getAttribute("fill")?.includes("grid"))) {
        detailPanel.style.display = "none";
        highlightWires(null);
      }
    });

    // Initialize View
    initLegend();
    renderWires();
    renderModules();
    updateTransform();
  </script>
</body>
</html>
