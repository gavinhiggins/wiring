<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentry Robot Wiring Diagram & Architecture</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel-bg: rgba(22, 27, 34, 0.95);
      --panel-border: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Header Bar */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    header .badge {
      font-size: 11px;
      background: #1f6feb33;
      border: 1px solid #388bfd66;
      color: #58a6ff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: normal;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn {
      background: #21262d;
      border: 1px solid #363b42;
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: #30363d;
      border-color: #8b949e;
    }

    /* Diagram Canvas Container */
    #viewport {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
      overflow: hidden;
    }

    #viewport.panning {
      cursor: grabbing;
    }

    svg#canvas {
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
    }

    /* SVG Nodes and Wires Styling */
    .module-box {
      rx: 8;
      stroke-width: 2;
      transition: filter 0.2s, stroke-width 0.2s;
      cursor: pointer;
    }

    .module-box:hover {
      filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.45));
      stroke-width: 2.5;
    }

    .module-title {
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
      pointer-events: none;
    }

    .module-sub {
      font-size: 10.5px;
      fill: #8b949e;
      pointer-events: none;
    }

    .section-boundary {
      fill: rgba(22, 27, 34, 0.4);
      stroke: #30363d;
      stroke-dasharray: 6 6;
      stroke-width: 1.5;
      rx: 12;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      fill: #8b949e;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* Wire Hover & Selection */
    .wire-group {
      cursor: pointer;
    }

    .wire-hitbox {
      stroke: transparent;
      stroke-width: 18px;
      fill: none;
      cursor: pointer;
    }

    .wire-hitbox:hover + .wire-render {
      filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px var(--accent));
    }

    .wire-group.active .wire-render {
      filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 12px var(--accent));
    }

    .wire-label {
      font-size: 10px;
      font-weight: 600;
      fill: #c9d1d9;
      paint-order: stroke;
      stroke: #0d1117;
      stroke-width: 3px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* Interactive Legend / Key */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      backdrop-filter: blur(12px);
      z-index: 40;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 280px;
    }

    #legend h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }

    .legend-item:hover {
      background: #21262d;
    }

    .legend-item.active {
      background: #1f6feb2d;
      border-left: 3px solid var(--accent);
    }

    .swatch {
      width: 30px;
      height: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Detail Modal / Flyout */
    #detail-panel {
      position: absolute;
      top: 68px;
      right: 20px;
      width: 360px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 18px 20px;
      backdrop-filter: blur(14px);
      z-index: 60;
      box-shadow: 0 14px 35px rgba(0,0,0,0.6);
      display: none;
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #detail-panel h3 {
      font-size: 16px;
      margin-bottom: 4px;
      color: #fff;
    }

    #detail-panel .sub-heading {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .detail-row {
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .detail-row span.label {
      color: var(--text-muted);
      display: block;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .detail-row span.value {
      color: var(--text-main);
      font-weight: 500;
    }

    #close-detail {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    #close-detail:hover {
      color: #fff;
    }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      background: #30363d;
      font-size: 11px;
      margin-right: 5px;
      margin-top: 3px;
    }

    /* Grid pattern background */
    .bg-grid {
      fill: none;
      stroke: #161b22;
      stroke-width: 1;
    }
    .bg-dots {
      fill: #21262d;
    }
  </style>
</head>
<body>

  <header>
    <h1>

      <span class="badge">RoboMaster 2026 Spec</span>
    </h1>
    <div class="header-controls">
      <span><kbd>Scroll</kbd> Zoom</span>
      <span>•</span>
      <span><kbd>Left-Click Drag</kbd> Pan</span>

      <button class="btn" id="btn-reset">Reset View</button>

  <!-- Interactive Legend / Wire Key -->
  <div id="legend">

  <div id="viewport">

        <!-- Arrow markers for signal direction -->

        </marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
        </marker>
      </defs>

      <!-- Pan & Zoom Group -->
      <g id="scene">
        <!-- Infinite Grid Background Layer -->
        <rect x="-10000" y="-10000" width="20000" height="20000" fill="url(#grid-dots)" />

        <!-- Subsystem Boundaries / Zones -->
        <g id="boundaries-layer"></g>

        <!-- Wires / Cables Layer -->
        <g id="wires-layer"></g>

        <!-- Modules / Electronic Boards Layer -->
        <g id="modules-layer"></g>
      </g>
    </svg>

    // Subsystem Region Definitions

      { id: "reg-chassis", name: "Chassis Subsystem", x: 30, y: 30, w: 760, h: 785 },

    // Helper functions for SVG twisted wires

    // Canvas & Viewport Pan/Zoom state
    let scale = 0.95;
    let translateX = 80;
    let translateY = 40;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    const viewport = document.getElementById("viewport");
    const scene = document.getElementById("scene");
    const detailPanel = document.getElementById("detail-panel");
    const legendList = document.getElementById("legend-list");

    function updateTransform() {
      scene.setAttribute("transform", `translate(${translateX}, ${translateY}) scale(${scale})`);
    }

    // Render Legend
    function initLegend() {
      Object.values(WIRE_SPECS).forEach(spec => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.setAttribute("data-wire-id", spec.id);

        let swatchHtml = "";
        if (spec.renderStyle === "twisted-pair") {
          swatchHtml = `<svg class="swatch" viewBox="0 0 30 12">
            <path d="M 0 4 Q 7 0 15 4 T 30 4" fill="none" stroke="${spec.c1}" stroke-width="2.5" />
            <path d="M 0 8 Q 7 12 15 8 T 30 8" fill="none" stroke="${spec.c2}" stroke-width="2.5" />
          </svg>`;
        } else if (spec.renderStyle === "dual-twisted") {
          swatchHtml = `<svg class="swatch" viewBox="0 0 30 12">
            <path d="M 0 3 Q 7 0 15 3 T 30 3" fill="none" stroke="${spec.c1}" stroke-width="1.8" />
            <path d="M 0 6 Q 7 9 15 6 T 30 6" fill="none" stroke="${spec.c2}" stroke-width="1.8" />
            <path d="M 0 9 Q 7 6 15 9 T 30 9" fill="none" stroke="${spec.c3}" stroke-width="1.8" />
          </svg>`;
        } else {
          swatchHtml = `<svg class="swatch" viewBox="0 0 30 12">
            <line x1="0" y1="6" x2="30" y2="6" stroke="${spec.stroke}" stroke-width="${spec.width || 3}" />
          </svg>`;
        }

        item.innerHTML = `${swatchHtml}<span>${spec.name}</span>`;
        item.addEventListener("click", () => {
          showDetailModal(spec);
          highlightWires(spec.id);
        });
        legendList.appendChild(item);
      });

    // Compute center anchor of module
    function getModuleAnchor(modId, side = "center") {
      const mod = MODULES.find(m => m.id === modId);
      if (!mod) return { x: 0, y: 0 };
      switch (side) {
        case "top": return { x: mod.x + mod.w / 2, y: mod.y };
        case "bottom": return { x: mod.x + mod.w / 2, y: mod.y + mod.h };
        case "left": return { x: mod.x, y: mod.y + mod.h / 2 };
        case "right": return { x: mod.x + mod.w, y: mod.y + mod.h / 2 };
        default: return { x: mod.x + mod.w / 2, y: mod.y + mod.h / 2 };
      }
    }

    // Path Builders for Straight, Orthogonal and Twisted Wires
    function buildPathD(pts) {
      if (pts.length === 0) return "";
      return "M " + pts.map(p => `${p[0]} ${p[1]}`).join(" L ");
    }

    // Render Boundary Regions
    function renderRegions() {
      const layer = document.getElementById("boundaries-layer");
      REGIONS.forEach(reg => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.innerHTML = `
          <rect class="section-boundary" x="${reg.x}" y="${reg.y}" width="${reg.w}" height="${reg.h}"></rect>
          <text class="section-title" x="${reg.x + 18}" y="${reg.y + 26}">${reg.name}</text>
        `;
        layer.appendChild(g);
      });
    }

    // Render Wires with Twisted Styles & Interactive Hits
    function renderWires() {
      const layer = document.getElementById("wires-layer");

      CONNECTIONS.forEach((conn, index) => {
        const spec = WIRE_SPECS[conn.spec];
        const fromMod = MODULES.find(m => m.id === conn.from);
        const toMod = MODULES.find(m => m.id === conn.to);
        if (!fromMod || !toMod) return;

        let points = [];
        if (conn.routing === "orthogonal" && conn.p1) {
          const startPt = [fromMod.x + fromMod.w / 2, fromMod.y + fromMod.h / 2];
          points.push(startPt);
          if (conn.p1) points.push(conn.p1);
          if (conn.p2) points.push(conn.p2);
          if (conn.p3) points.push(conn.p3);
          if (conn.p4) points.push(conn.p4);
          points.push([toMod.x + toMod.w / 2, toMod.y + toMod.h / 2]);
        } else {
          // Direct straight connection
          points = [
            [fromMod.x + fromMod.w / 2, fromMod.y + fromMod.h / 2],
            [toMod.x + toMod.w / 2, toMod.y + toMod.h / 2]
          ];
        }

        const pathD = buildPathD(points);

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.classList.add("wire-group");
        g.setAttribute("data-wire-id", spec.id);

        let renderContent = "";

        if (spec.renderStyle === "twisted-pair") {
          // Twisted White & Red or Yellow & Gray
          renderContent = `
            <path class="wire-render" d="${pathD}" stroke="${spec.c1}" stroke-width="${spec.width + 1}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path class="wire-render" d="${pathD}" stroke="${spec.c2}" stroke-width="${spec.width}" stroke-dasharray="8 8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          `;
        } else if (spec.renderStyle === "dual-twisted") {
          // 4-pin CAN: 2 twisted pairs
          renderContent = `
            <path class="wire-render" d="${pathD}" stroke="${spec.c1}" stroke-width="${spec.width + 2}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path class="wire-render" d="${pathD}" stroke="${spec.c2}" stroke-width="${spec.width + 0.5}" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path class="wire-render" d="${pathD}" stroke="${spec.c3}" stroke-width="${spec.width - 0.5}" stroke-dasharray="12 12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          `;
        } else {
          // Solid wire (straight or orthogonal)
          renderContent = `
            <path class="wire-render" d="${pathD}" stroke="${spec.stroke}" stroke-width="${spec.width}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          `;
        }

        // Invisible wider stroke for easy click & hover hitbox
        renderContent += `<path class="wire-hitbox" d="${pathD}" />`;

        // Midpoint label
        if (conn.label && points.length >= 2) {
          const midIdx = Math.floor(points.length / 2);
          const pA = points[midIdx - 1];
          const pB = points[midIdx];
          const mx = (pA[0] + pB[0]) / 2;
          const my = (pA[1] + pB[1]) / 2 - 6;
          renderContent += `<text class="wire-label" x="${mx}" y="${my}" text-anchor="middle">${conn.label}</text>`;
        }

        g.innerHTML = renderContent;

        // Click to view details
        g.addEventListener("click", (e) => {
          e.stopPropagation();
          showDetailModal(spec, conn);
          highlightWires(spec.id);
        });

        layer.appendChild(g);
      });
    }

    // Render Modules
    function renderModules() {
      const layer = document.getElementById("modules-layer");
      MODULES.forEach(mod => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.innerHTML = `
          <rect class="module-box" x="${mod.x}" y="${mod.y}" width="${mod.w}" height="${mod.h}" fill="${mod.bg}" stroke="${mod.stroke}" />
          <text class="module-title" x="${mod.x + mod.w / 2}" y="${mod.y + mod.h / 2 - 3}" text-anchor="middle">${mod.name}</text>
          <text class="module-sub" x="${mod.x + mod.w / 2}" y="${mod.y + mod.h / 2 + 13}" text-anchor="middle">${mod.sub}</text>
        `;

        g.addEventListener("click", (e) => {
          e.stopPropagation();
          showModuleModal(mod);
        });

        layer.appendChild(g);
      });
    }

    // Highlighting wires by ID
    function highlightWires(wireId) {
      document.querySelectorAll(".wire-group").forEach(el => {
        if (el.getAttribute("data-wire-id") === wireId) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      });

      document.querySelectorAll(".legend-item").forEach(el => {
        if (el.getAttribute("data-wire-id") === wireId) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      });
    }

    // Show Detail Modal
    function showDetailModal(spec, conn) {
      document.getElementById("panel-title").innerText = spec.name;
      document.getElementById("panel-sub").innerText = spec.type;

      let bodyHtml = `
        <div class="detail-row">
          <span class="label">Color Coding & Appearance</span>
          <span class="value">${spec.colorDesc}</span>
        </div>
        <div class="detail-row">
          <span class="label">Wire Gauge & Spec</span>
          <span class="value">${spec.gauge}</span>
        </div>
        <div class="detail-row">
          <span class="label">Connector Family</span>
          <span class="value">${spec.connector}</span>
        </div>
        <div class="detail-row">
          <span class="label">Crimp & Terminal Info</span>
          <span class="value">${spec.crimp}</span>
        </div>
        <div class="detail-row">
          <span class="label">Protocol & Electrical Ratings</span>
          <span class="value">${spec.protocol}</span>
        </div>
      `;

      if (conn) {
        bodyHtml += `
          <div style="border-top: 1px solid var(--panel-border); margin: 12px 0; padding-top: 8px;">
            <div class="detail-row">
              <span class="label">Selected Connection</span>
              <span class="value"><strong>${conn.from}</strong> ➔ <strong>${conn.to}</strong> (${conn.label})</span>
            </div>
          </div>
        `;
      }

      document.getElementById("panel-body").innerHTML = bodyHtml;
      detailPanel.style.display = "block";
    }

    // Show Module Info Modal
    function showModuleModal(mod) {
      document.getElementById("panel-title").innerText = mod.name;
      document.getElementById("panel-sub").innerText = `Subsystem: ${mod.zone.toUpperCase()} • ${mod.sub}`;

      const connectedWires = CONNECTIONS.filter(c => c.from === mod.id || c.to === mod.id);

      let linksHtml = connectedWires.map(c => {
        const spec = WIRE_SPECS[c.spec];
        const isFrom = c.from === mod.id;
        const target = isFrom ? c.to : c.from;
        const dir = isFrom ? "➔ Out to" : "⬅ In from";
        return `<div class="tag" style="display:block; margin-bottom:5px;">${dir} <strong>${target}</strong>: ${spec.name} (${c.label})</div>`;
      }).join("");

      document.getElementById("panel-body").innerHTML = `
        <div class="detail-row">
          <span class="label">Description</span>
          <span class="value">${mod.name} (${mod.sub})</span>
        </div>
        <div class="detail-row">
          <span class="label">Connected Harnesses (${connectedWires.length})</span>
          <div style="margin-top: 8px;">${linksHtml || "No direct links recorded"}</div>
        </div>
      `;
      detailPanel.style.display = "block";
    }

    // Modal close
    document.getElementById("close-detail").addEventListener("click", () => {
      detailPanel.style.display = "none";
      highlightWires(null);
    });

    // Pan and Zoom Event Handlers
    viewport.addEventListener("mousedown", (e) => {
      if (e.button === 0) { // Left click
        isPanning = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        viewport.classList.add("panning");
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (!isPanning) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => {
      isPanning = false;
      viewport.classList.remove("panning");
    });

    // Zoom on wheel scroll
    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = 1.12;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const prevScale = scale;
      if (e.deltaY < 0) {
        scale = Math.min(scale * zoomFactor, 4.0); // Zoom in
      } else {
        scale = Math.max(scale / zoomFactor, 0.25); // Zoom out
      }

      // Zoom towards mouse position
      translateX = mouseX - (mouseX - translateX) * (scale / prevScale);
      translateY = mouseY - (mouseY - translateY) * (scale / prevScale);
      updateTransform();
    }, { passive: false });

    // Buttons
    document.getElementById("btn-reset").addEventListener("click", () => {
      scale = 0.95;
      translateX = 80;
      translateY = 40;
      updateTransform();
    });

    document.getElementById("btn-fit").addEventListener("click", () => {
      scale = 0.72;
      translateX = 50;
      translateY = 30;
      updateTransform();
    });

    // Close panel when clicking background
    viewport.addEventListener("click", (e) => {
      if (e.target.id === "viewport" || e.target.id === "canvas" || e.target.tagName === "rect" && e.target.getAttribute("fill")?.includes("grid")) {
        detailPanel.style.display = "none";
        highlightWires(null);
      }
    });

    // Initialize View
    initLegend();
    renderRegions();
    renderWires();
    renderModules();
    updateTransform();
  </script>
